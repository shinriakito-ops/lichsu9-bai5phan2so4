<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 5 – Phần 4: Sự ra đời của các tổ chức yêu nước cách mạng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #070403;
  --gold-main: #d4af37;
  --gold-light: #ffd76a;
  --text-light: #fcf8f2;
  --text-muted: #c8b9ab;
  --color-success: #34c759;
  --color-danger: #ff3b30;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-color);
  color: var(--text-light);
  font-family: 'Be Vietnam Pro', sans-serif;
}

body {
  background: radial-gradient(ellipse at 50% 40%, #2a120c 0, #070403 70%);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7));
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#bg-canvas { z-index: 1; }
#confetti-canvas { z-index: 99; }

.drum-bg {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 130vmin;
  height: 130vmin;
  margin: -65vmin 0 0 -65vmin;
  opacity: 0.1;
  z-index: 0;
  fill: none;
  stroke: var(--gold-main);
  animation: spinDrum 90s linear infinite;
}

@keyframes spinDrum {
  to { transform: rotate(360deg); }
}

#progress-line {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  width: 0%;
  z-index: 60;
  background: linear-gradient(90deg, #8b0000, var(--gold-light));
  box-shadow: 0 0 14px var(--gold-light);
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.top-bar {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  z-index: 50;
  pointer-events: none;
}

.tag-pill {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.4px;
  color: var(--gold-light);
  background: rgba(18, 10, 8, 0.85);
  border: 1px solid var(--gold-main);
  padding: 7px 16px;
  border-radius: 30px;
}

#stage {
  position: absolute;
  inset: 0;
  z-index: 10;
}

#slide-container {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1100px;
  height: 640px;
  margin: -320px 0 0 -550px;
  transform: scale(var(--scale-ratio, 1));
  perspective: 1400px;
}

.slide {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 1100px;
  height: 640px;
  flex-direction: column;
  justify-content: center;
  padding: 42px 54px;
  overflow: hidden auto;
  border: 2px solid var(--gold-main);
  border-radius: 20px;
  background: linear-gradient(160deg, rgba(34, 17, 12, 0.94), rgba(14, 8, 6, 0.96));
  outline: 1px solid rgba(212, 175, 55, 0.4);
  outline-offset: -10px;
  box-shadow: 0 30px 80px #000, inset 0 0 60px rgba(212, 175, 55, 0.08);
}

.slide.active {
  display: flex;
  z-index: 2;
  animation: slideIn 1.1s var(--ease-timing) backwards;
}

.slide.leave {
  display: flex;
  z-index: 1;
  pointer-events: none;
  animation: slideOut 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: var(--from-transform); clip-path: var(--clip-start); }
  to { opacity: 1; transform: none; clip-path: var(--clip-end); }
}

@keyframes slideOut {
  to { opacity: 0; transform: var(--out-transform); }
}

.slide.active::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 215, 106, 0.22) 50%, transparent 65%);
  animation: sweepGlare 1.6s 0.25s ease-out both;
}

@keyframes sweepGlare {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

.slide-title {
  position: relative;
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 3.6vw, 38px);
  font-weight: 900;
  line-height: 1.25;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 2px dashed rgba(212, 175, 55, 0.35);
}

.word-span {
  display: inline-block;
  color: var(--gold-light);
  text-shadow: 0 2px 16px rgba(244, 196, 48, 0.35);
}

.active .word-span {
  animation: wordDrop 0.9s cubic-bezier(0.16, 1, 0.3, 1) calc(0.2s + var(--word-index) * 0.07s) backwards;
}

@keyframes wordDrop {
  from { opacity: 0; transform: translateY(0.6em); }
}

.active .anim-target {
  animation: riseUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) calc(0.5s + var(--item-index) * 0.15s) backwards;
}

@keyframes riseUp {
  from { opacity: 0; transform: translate(var(--offset-x, 0), 50px) scale(0.9); }
}

.anim-target.left { --offset-x: -70px; }
.anim-target.right { --offset-x: 70px; }

.grid-layout {
  position: relative;
  display: grid;
  gap: 22px;
  width: 100%;
}
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

.info-card {
  position: relative;
  background: rgba(36, 20, 15, 0.82);
  border: 1px solid var(--gold-main);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  transform: perspective(700px) rotateX(var(--rot-x, 0deg)) rotateY(var(--rot-y, 0deg));
  transition: transform 0.15s, box-shadow 0.3s, border-color 0.3s;
}

.info-card:hover {
  border-color: var(--gold-light);
  box-shadow: 0 14px 36px rgba(244, 196, 48, 0.28);
}

.card-icon {
  font-size: 30px;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 10px rgba(255, 215, 106, 0.5));
}

.info-card h3 { font-size: 19px; margin-bottom: 8px; }
.info-card p { font-size: 15px; line-height: 1.7; color: var(--text-muted); }
.info-card b { color: var(--gold-light); }
.info-card small {
  display: block;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gold-main);
  margin-top: 10px;
}

.big-banner {
  text-align: center;
  padding: 34px;
  border-left: 5px solid var(--gold-main);
}
.big-banner.red { border-color: var(--color-danger); }

.banner-head {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 900;
  color: var(--gold-light);
  margin-bottom: 14px;
}
.big-banner.red .banner-head { color: #ff6b5e; }
.big-banner p { font-size: 17px; color: var(--text-light); }

.watermark-year {
  position: absolute;
  right: 34px;
  top: 12px;
  font: 900 clamp(70px, 13vw, 150px)/1 'Playfair Display', serif;
  color: transparent;
  -webkit-text-stroke: 1px rgba(212, 175, 55, 0.35);
  pointer-events: none;
}

.question-text { font-size: clamp(17px, 2.2vw, 21px); font-weight: 700; }
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 18px;
}

.option-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: rgba(45, 28, 22, 0.85);
  border: 2px solid var(--gold-main);
  border-radius: 12px;
  padding: 16px 18px;
  color: var(--text-light);
  font: 600 16px 'Be Vietnam Pro', sans-serif;
  cursor: pointer;
  transition: 0.25s;
}

.option-btn:disabled { cursor: default; color: var(--text-light); }
.option-btn:hover:not(:disabled) {
  background: rgba(139, 0, 0, 0.5);
  transform: scale(1.03);
}

.letter-badge {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--gold-light);
  color: #000;
  display: grid;
  place-items: center;
  font-weight: 800;
}

.option-btn.ok {
  background: rgba(52, 199, 89, 0.28);
  border-color: var(--color-success);
  box-shadow: 0 0 24px rgba(52, 199, 89, 0.6);
}

.option-btn.no {
  background: rgba(255, 59, 48, 0.28);
  border-color: var(--color-danger);
  box-shadow: 0 0 24px rgba(255, 59, 48, 0.5);
}

.option-btn.shake { animation: shakeAnim 0.5s; }
@keyframes shakeAnim {
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

.revealed .option-btn:not(.ok) { opacity: 0.3; filter: grayscale(0.6); }
.revealed .option-btn.ok {
  transform: scale(1.05);
  animation: glowOk 1.4s ease-in-out infinite alternate;
}

@keyframes glowOk {
  to { box-shadow: 0 0 42px rgba(52, 199, 89, 0.95); }
}

.timer-bar {
  height: 5px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  margin-top: 20px;
  overflow: hidden;
}

.timer-bar i {
  display: block;
  height: 100%;
  transform-origin: left;
  background: linear-gradient(90deg, var(--color-danger), var(--gold-light));
  animation: timerRun 20s linear forwards;
}

@keyframes timerRun {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

.timer-bar.done i { animation: none; transform: scaleX(0); }
.pick-result { margin: 16px 0 12px; font-weight: 700; color: var(--gold-light); }

.cover-view { text-align: center; position: relative; }
.cover-view .slide-title { font-size: clamp(26px, 4vw, 44px); border: 0; margin: 14px 0 8px; }
.cover-sub {
  margin: 0;
  letter-spacing: 4px;
  color: var(--gold-light);
  font-weight: 700;
  font-size: 14px;
  text-transform: uppercase;
}
.cover-sub2 {
  margin: 8px 0 0;
  color: var(--text-light);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.year-hero {
  font: 900 clamp(40px, 8vw, 84px) 'Playfair Display', serif;
  color: var(--gold-light);
  text-shadow: 0 0 30px rgba(244, 196, 48, 0.5);
}
.year-hero i { font-style: normal; opacity: 0.6; margin: 0 0.3em; }

.timeline-bottom {
  position: fixed;
  left: 50%;
  bottom: calc(46px + env(safe-area-inset-bottom, 0px));
  width: min(940px, 86vw);
  height: 6px;
  transform: translateX(-50%);
  background: rgba(212, 175, 55, 0.22);
  border-radius: 3px;
  z-index: 50;
}

.timeline-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #8b0000, var(--gold-light));
  box-shadow: 0 0 12px var(--gold-light);
  transition: width 1.1s cubic-bezier(0.16, 1, 0.3, 1);
}

.timeline-node {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  border: 2px solid var(--gold-main);
  background: #1a0d09;
  transition: 0.6s;
}

.timeline-node.active-node {
  background: var(--gold-light);
  box-shadow: 0 0 14px var(--gold-light);
}

.timeline-node i {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-style: normal;
  text-align: center;
  font-size: 11px;
  line-height: 1.35;
  color: var(--text-muted);
  transition: 0.5s;
}

.timeline-node.up i { bottom: 20px; }
.timeline-node.down i { top: 20px; }
.timeline-node i b { display: block; font-size: 12px; color: var(--gold-main); }
.timeline-node.active-node i { color: var(--text-light); }
.timeline-node.active-node i b { color: var(--gold-light); }

.star-marker {
  position: absolute;
  top: 50%;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  display: grid;
  place-items: center;
  font-size: 20px;
  color: var(--gold-light);
  text-shadow: 0 0 14px var(--gold-light);
  transition: left 1.1s cubic-bezier(0.16, 1, 0.3, 1);
}

@media(max-width: 768px) {
  .timeline-bottom { display: none; }
  #slide-container { inset: 0; width: auto; height: auto; margin: 0; transform: none; }
  .slide { padding: 22px 20px; top: 60px; bottom: 90px; left: 0; right: 0; margin: auto; width: 92%; height: auto; }
  .grid-2, .grid-3, .options-grid { grid-template-columns: 1fr; }
}

.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
th {
  color: var(--gold-light);
  text-align: left;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 6px 10px;
  border-bottom: 2px solid var(--gold-main);
}
td {
  padding: 10px;
  border-bottom: 1px solid rgba(212, 175, 55, 0.25);
  color: var(--text-muted);
  vertical-align: top;
}
td:first-child { color: var(--text-light); }
td b { color: var(--gold-light); }

.summary-tip {
  position: relative;
  margin-top: 16px;
  padding: 10px 16px;
  border-radius: 10px;
  background: rgba(212, 175, 55, 0.12);
  border: 1px dashed var(--gold-main);
  font-size: 15px;
  color: var(--gold-light);
}

.lead-text { font-style: italic; color: var(--gold-light); margin: -8px 0 16px; font-size: 17px; }

#toast-msg {
  position: fixed;
  top: calc(62px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: rgba(18, 10, 8, 0.92);
  border: 1px solid var(--gold-main);
  color: var(--gold-light);
  padding: 8px 20px;
  border-radius: 30px;
  z-index: 80;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  font-weight: 700;
}
#toast-msg.show { opacity: 1; }

.active .info-card.anim-target {
  animation: riseUp 0.9s var(--ease-timing) calc(0.5s + var(--item-index) * 0.15s) backwards,
             cardGlow 1.1s ease-out calc(0.8s + var(--item-index) * 0.15s);
}

@keyframes cardGlow {
  40% { box-shadow: 0 0 38px rgba(255, 215, 106, 0.75); border-color: var(--gold-light); }
}

#flash-screen {
  position: fixed;
  inset: 0;
  z-index: 70;
  pointer-events: none;
  opacity: 0;
}
#flash-screen.ok {
  background: radial-gradient(circle, rgba(52, 199, 89, 0.38), transparent 70%);
  animation: flashAnim 0.7s;
}
#flash-screen.no {
  background: radial-gradient(circle, rgba(255, 59, 48, 0.42), transparent 70%);
  animation: flashAnim 0.7s;
}

@keyframes flashAnim {
  from { opacity: 1; }
  to { opacity: 0; }
}
</style>
</head>
<body>

<svg class="drum-bg" id="drum-svg" viewBox="-100 -100 200 200"></svg>
<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div id="flash-screen"></div>
<div id="progress-line"></div>

<div class="top-bar">
  <div class="tag-pill">★ LỊCH SỬ 9 • KẾT NỐI TRI THỨC</div>
  <div class="tag-pill"><span id="slide-num">01</span> / 20</div>
</div>

<div id="stage">
  <div id="slide-container"></div>
</div>

<div class="timeline-bottom" id="timeline-bar"></div>
<div id="toast-msg"></div>

<script>
const quizQuestions = [
  {
    question: 'Ba tổ chức yêu nước cách mạng ra đời trong giai đoạn 1925 – 1928 là:',
    options: [
      'Hội Việt Nam Cách mạng Thanh niên, Tâm tâm xã, Nam Đồng thư xã',
      'Hội Phục Việt, Tâm tâm xã, Việt Nam Quốc dân đảng',
      'Hội Việt Nam Cách mạng Thanh niên, Tân Việt Cách mạng đảng, Việt Nam Quốc dân đảng',
      'Tân Việt Cách mạng đảng, Nam Đồng thư xã, Hội Phục Việt'
    ],
    answer: 2,
    explain: 'Đó là Hội Việt Nam Cách mạng Thanh niên (6/1925), Việt Nam Quốc dân đảng (12/1927) và Tân Việt Cách mạng đảng (7/1928). Tâm tâm xã, Nam Đồng thư xã, Hội Phục Việt là cơ sở, tiền thân của các tổ chức này.'
  },
  {
    question: 'Nhận định nào đúng về khuynh hướng và phương pháp hoạt động của các tổ chức?',
    options: [
      'Hội VNCMTN theo dân chủ tư sản; Quốc dân đảng theo vô sản, “vô sản hoá”',
      'Hội VNCMTN theo vô sản, huấn luyện cán bộ, “vô sản hoá”; Quốc dân đảng theo dân chủ tư sản, bạo động, ám sát',
      'Cả ba tổ chức đều theo khuynh hướng dân chủ tư sản, chủ trương bạo động',
      'Tân Việt theo vô sản ngay từ đầu; Quốc dân đảng theo dân chủ tư sản, ám sát'
    ],
    answer: 1,
    explain: 'Hội Việt Nam Cách mạng Thanh niên theo khuynh hướng vô sản (huấn luyện cán bộ, “vô sản hoá”). Việt Nam Quốc dân đảng theo khuynh hướng dân chủ tư sản, chủ trương bạo động, ám sát cá nhân.'
  },
  {
    question: 'Vì sao nói khuynh hướng vô sản ngày càng thắng thế trong phong trào dân tộc dân chủ ở Việt Nam?',
    options: [
      'Vì thực dân Pháp ngừng đàn áp nên các tổ chức hoạt động tự do, phát triển mạnh',
      'Vì khởi nghĩa Yên Bái thành công, Việt Nam Quốc dân đảng ngày càng lớn mạnh',
      'Vì Hội VNCMTN bị giải tán sau vụ ám sát Bazin, Tân Việt lên thay vai trò lãnh đạo',
      'Vì Yên Bái thất bại, Quốc dân đảng tan rã; Hội VNCMTN phát triển, Tân Việt chuyển theo vô sản'
    ],
    answer: 3,
    explain: 'Khởi nghĩa Yên Bái thất bại và Quốc dân đảng tan rã cho thấy khuynh hướng dân chủ tư sản hoàn toàn bất lực. Trong khi đó, Hội Việt Nam Cách mạng Thanh niên phát triển và Tân Việt chuyển biến, chứng tỏ khuynh hướng vô sản ngày càng thắng thế.'
  }
];

const slideData = [
  { type: 'cover' },
  {
    type: 'cards', year: 1925, title: '1. Bối cảnh lịch sử',
    subtitle: 'Giai đoạn 1925 – 1930: các tổ chức yêu nước cách mạng lần lượt ra đời.',
    cards: [
      { icon: '🔥', title: 'Phong trào phát triển', desc: 'Phong trào dân tộc dân chủ phát triển mạnh.' },
      { icon: '⛓️', title: 'Pháp tăng cường đàn áp', desc: 'Thực dân Pháp tăng cường đàn áp phong trào.' },
      { icon: '🤝', title: 'Tổ chức ra đời', desc: 'Người yêu nước đoàn kết, lập các tổ chức yêu nước cách mạng, thúc đẩy phong trào đấu tranh mạnh mẽ hơn.' }
    ]
  },
  {
    type: 'cards', year: 1925, title: '2. Hội Việt Nam Cách mạng Thanh niên',
    subtitle: 'Tổ chức đầu tiên ra đời năm 1925.',
    cards: [
      { icon: '🚩', title: 'Thành lập', desc: 'Tháng 6/1925, tại Quảng Châu (Trung Quốc), do <b>Nguyễn Ái Quốc</b> thành lập, trên cơ sở thanh niên ưu tú ở Trung Quốc (<i>Tâm tâm xã</i>) và từ trong nước sang.' },
      { icon: '🎯', title: 'Mục đích', desc: 'Làm cách mạng dân tộc giành độc lập, sau đó làm cách mạng thế giới để đi đến xã hội cộng sản.' },
      { icon: '🎓', title: 'Hoạt động', desc: 'Công bố Chương trình, Điều lệ; mở nhiều lớp huấn luyện cán bộ.' }
    ]
  },
  {

function makeTitleHTML(titleText) {

}

function makeWatermarkHTML(year) {
  return year ? `<div class="watermark-year counter-val" data-count="${year}">${year}</div>` : '';
}

function renderOptionsHTML(qData, isRev) {
  return qData.options.map((optText, idx) => {
    const isOkClass = isRev && idx === qData.answer ? ' ok' : '';
    const disAttr = isRev ? ' disabled' : '';
    return `<button class="option-btn${isOkClass}" data-opt-index="${idx}"${disAttr}><span class="letter-badge">${'ABCD'[idx]}</span>${optText}</button>`;
  }).join('');
}

const transitionPresets = {
  dolly: { fromTransform: 'scale(2.6)', outTransform: 'scale(0.55)' },
  slit: { fromTransform: 'scale(1.06)', clipStart: 'inset(50% 0 round 20px)', outTransform: 'scale(0.9)' },

  page: { fromTransform: 'rotateY(80deg)', transformOrigin: '100% 50%', outTransform: 'rotateY(-35deg) translateX(-10%)' },
  rise: { fromTransform: 'translateY(110%)', outTransform: 'translateY(-35%) scale(0.92)', easeTiming: 'cubic-bezier(0.34, 1.45, 0.64, 1)' },
  ripple: { fromTransform: 'scale(0.9)', clipStart: 'circle(0% at 50% 50%)', clipEnd: 'circle(150% at 50% 50%)', outTransform: 'scale(1.18)' },
  diag: { fromTransform: 'translateX(-6%)', clipStart: 'polygon(-20% -20%,-20% -20%,-40% 120%,-40% 120%)', clipEnd: 'polygon(-20% -20%,140% -20%,120% 120%,-40% 120%)', outTransform: 'translateX(6%) scale(0.96)' },
  tumble: { fromTransform: 'rotateX(-85deg) translateY(-20%)', transformOrigin: '50% 0%', outTransform: 'rotateX(55deg) translateY(30%)' },
  drop: { fromTransform: 'translateY(-115%) rotate(-5deg)', outTransform: 'translateY(45%) scale(0.9)', easeTiming: 'cubic-bezier(0.3, 1.6, 0.5, 1)' },
  scroll: { fromTransform: 'scale(0.96)', clipStart: 'inset(0 50% round 20px)', outTransform: 'scale(1.05)' },
  flip: { fromTransform: 'rotateY(95deg)', transformOrigin: '100% 50%', outTransform: 'rotateY(-60deg) scale(0.9)' }
};

const transitionMap = 'dolly slit door page rise ripple diag tumble drop dolly scroll flip ripple slit diag page tumble dolly scroll dolly'.split(' ');

let scaleZoom = 1;
function updateViewportScale() {
  const scale = Math.max(0.3, Math.min((window.innerWidth - 40) / 1100, (window.innerHeight - 190) / 640, 1.8)) * scaleZoom;
  slideContainer.style.setProperty('--scale-ratio', scale);
}
updateViewportScale();
window.addEventListener('resize', updateViewportScale);

function applyTransition(el, preset) {
  const defaultClip = 'inset(-80px round 20px)';
  const defaultEase = 'cubic-bezier(0.16, 1, 0.3, 1)';
  el.style.setProperty('--from-transform', preset.fromTransform);
  el.style.setProperty('--clip-start', preset.clipStart || defaultClip);
  el.style.setProperty('--clip-end', preset.clipEnd || defaultClip);
  el.style.setProperty('--ease-timing', preset.easeTiming || defaultEase);
  el.style.transformOrigin = preset.transformOrigin || '50% 50%';
}

function handleSlideChange(nextIdx) {
  if (nextIdx === currentSlide || nextIdx < 0 || nextIdx >= slideElements.length) return;
  const currentEl = slideElements[currentSlide];
  const nextEl = slideElements[nextIdx];

  applyTransition(nextEl, transitionPresets[transitionMap[nextIdx]]);
  currentEl.style.setProperty('--out-transform', transitionPresets[transitionMap[currentSlide]].outTransform);
  currentEl.style.transformOrigin = '50% 50%';

  currentEl.classList.remove('active');
  currentEl.classList.add('leave');
  setTimeout(() => currentEl.classList.remove('leave'), 620);

  nextEl.classList.remove('leave');
  nextEl.classList.add('active');
  currentSlide = nextIdx;
  updateUI();
  playSfx([0, 9, 19].includes(nextIdx) ? 'big' : 'go');
  triggerTimelinePulse();
}

function runNumberCounter(el) {
  const target = +el.dataset.count;
  const start = target - 14;
  const startTime = performance.now();
  function animate(now) {
    const progress = Math.min(1, (now - startTime) / 1400);
    const ease = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(start + (target - start) * ease);
    if (progress < 1) requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}

function updateUI() {
  const el = slideElements[currentSlide];
  const data = slideData[currentSlide];
  const yearVal = data.year || (currentSlide ? 1930 : 1925);

  document.getElementById('progress-line').style.width = ((currentSlide + 1) / slideElements.length * 100) + '%';
  document.getElementById('slide-num').textContent = String(currentSlide + 1).padStart(2, '0');
  
  updateTimelineUI(timelineDates[currentSlide]);
  el.querySelectorAll('.counter-val').forEach(runNumberCounter);

  const scoreEl = el.querySelector('.score-display');
  if (scoreEl) {
    const correctCount = quizQuestions.filter((q, i) => userPicks[i] === q.answer).length;
    scoreEl.textContent = `Bạn đã trả lời đúng ${correctCount}/${quizQuestions.length} câu hỏi củng cố 🎉`;
  }

  const resultEl = el.querySelector('.pick-result');
  if (resultEl) {
    const q = quizQuestions[data.qIndex];
    const picked = userPicks[data.qIndex];
    if (picked == null) resultEl.textContent = 'Bạn chưa chọn đáp án ở câu này.';
    else if (picked === q.answer) resultEl.textContent = '✔ Bạn đã chọn đúng!';
    else resultEl.textContent = `✘ Bạn đã chọn ${'ABCD'[picked]} — chưa chính xác.`;
  }
}

];

  1925, 1925.2, 1925.45, 1927.3, 1928.2, 1928.55, 1929, 1927.95, 1929.1,
  1930.1, 1930.1, 1930.1, 1930.1, 1930.1, 1930.1, 1930.1, 1930.1, 1930.1, 1930.1, 1930.1
];

function calcPercent(d) { return (d - 1924.8) / 5.6 * 100; }

const timelineBar = document.getElementById('timeline-bar');
timelineBar.innerHTML = `
  <div class="timeline-fill" id="timeline-fill"></div>
  ${timelineEvents.map(([d, dateText, labelText], idx) => `
    <div class="timeline-node ${idx % 2 ? 'down' : 'up'}" data-date="${d}" style="left:${calcPercent(d)}%">
      <i><b>${dateText}</b>${labelText}</i>
    </div>`).join('')}
  <div class="star-marker" id="timeline-marker">★</div>`;

function updateTimelineUI(d) {
  document.getElementById('timeline-fill').style.width = calcPercent(d) + '%';
  document.getElementById('timeline-marker').style.left = calcPercent(d) + '%';
  document.querySelectorAll('.timeline-node').forEach(node => {
    node.classList.toggle('active-node', +node.dataset.date <= d + 0.01);
  });
}

applyTransition(slideElements[0], transitionPresets.dolly);
slideElements[0].classList.add('active');
updateUI();

function finishQuestion(container, pickIndex, btnEl) {
  const qIndex = +container.dataset.qIndex;
  const q = quizQuestions[qIndex];
  container.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
  container.nextElementSibling.classList.add('done');

  if (pickIndex === null) {
    container.children[q.answer].classList.add('ok');
    playSfx('tick');
    return;
  }

  userPicks[qIndex] = pickIndex;
  if (pickIndex === q.answer) {
    btnEl.classList.add('ok');
    playSfx('ok');
    triggerFlash('ok');
    launchConfetti();
  } else {
    btnEl.classList.add('no', 'shake');
    playSfx('no');
    triggerFlash('no');
  }
}

document.getElementById('stage').addEventListener('click', e => {
  const btn = e.target.closest('.option-btn');
  if (btn && !btn.disabled) {
    finishQuestion(btn.parentElement, +btn.dataset.optIndex, btn);
  }
});

document.getElementById('stage').addEventListener('animationend', e => {
  if (!e.target.matches('.timer-bar i')) return;
  const opts = e.target.parentElement.previousElementSibling;
  if (!opts.querySelector('.option-btn:disabled')) finishQuestion(opts, null);
});

document.getElementById('stage').addEventListener('pointermove', e => {
  const card = e.target.closest('.info-card');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  card.style.setProperty('--rot-y', ((e.clientX - rect.left) / rect.width - 0.5) * 10 + 'deg');
  card.style.setProperty('--rot-x', -((e.clientY - rect.top) / rect.height - 0.5) * 10 + 'deg');
});

document.getElementById('stage').addEventListener('pointerout', e => {
  const card = e.target.closest('.info-card');
  if (card) {
    card.style.setProperty('--rot-x', '0deg');
    card.style.setProperty('--rot-y', '0deg');
  }
});

window.addEventListener('keydown', e => {
  const key = e.key;
  if ([' ', 'ArrowRight', 'PageDown'].includes(key)) { e.preventDefault(); handleSlideChange(currentSlide + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(key)) { e.preventDefault(); handleSlideChange(currentSlide - 1); }
  else if (key === 'Home') handleSlideChange(0);
  else if (key === 'End') handleSlideChange(slideElements.length - 1);
  else if (key === 'm' || key === 'M') toggleMute();
  else if (key === 'f' || key === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
});

function displayToast(msg) {
  const toast = document.getElementById('toast-msg');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(displayToast.timer);
  displayToast.timer = setTimeout(() => toast.classList.remove('show'), 1300);
}

let touchStartX = 0;
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
window.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 60) handleSlideChange(currentSlide + (diff < 0 ? 1 : -1));
});

let audioCtx, noiseBuffer, masterGain, isMuted = false;

function toggleMute() {
  isMuted = !isMuted;
  displayToast(isMuted ? '🔇 Đã tắt âm thanh' : '🔊 Đã bật âm thanh');
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.8;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 5500;
    
    masterGain.connect(filter);
    filter.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, time, dur, vol, endFreq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, time);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, time + dur);
  
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.linearRampToValueAtTime(vol, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(time);
  osc.stop(time + dur + 0.05);
}

function playSfx(type) {
  if (isMuted) return;
  try {
    initAudio();
    const t = audioCtx.currentTime;
    if (type === 'go') {
      playTone(440, t, 0.3, 0.05, 880);
    } else if (type === 'big') {
      playTone(110, t, 0.8, 0.2, 440);
    } else if (type === 'ok') {
      [523, 659, 784].forEach((f, i) => playTone(f, t + i * 0.08, 0.4, 0.1));
    } else if (type === 'no') {
      playTone(220, t, 0.3, 0.2, 110);
    } else if (type === 'tick') {
      playTone(150, t, 0.1, 0.1);
    }
  } catch (e) {}
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const particles = Array.from({ length: 90 }, () => ({
    x: canvas.width / 2,
    y: canvas.height * 0.6,
    vx: (Math.random() - 0.5) * 18,
    vy: Math.random() * -16 - 2,
    size: Math.random() * 8 + 4,
    life: 100,
    color: ['#f4c430', '#34c759', '#ff3b30', '#ffffff'][Math.floor(Math.random() * 4)]
  }));

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    particles.forEach(p => {
      if (p.life > 0) {
        active = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        p.life -= 1.2;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size * 0.6);
      }
    });
    if (active) requestAnimationFrame(render);
  }
  render();
}

/* Background Drum & Dust Effects */
let drumSVG = '';
for (let i = 0; i < 16; i++) drumSVG += `<line y1="-24" y2="-46" transform="rotate(${i * 22.5})"/>`;
document.getElementById('drum-svg').innerHTML = drumSVG + '<circle r="94" stroke-dasharray="2 5"/><circle r="84"/><circle r="72" stroke-dasharray="9 4"/><circle r="56"/><circle r="22"/><circle r="12" stroke-width="3"/>';

const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
function resizeCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function triggerTimelinePulse() {
  const drum = document.getElementById('drum-svg');
  drum.style.animation = 'none';
  void drum.offsetWidth;
  drum.style.animation = 'spinDrum 90s linear infinite';
}

function triggerFlash(type) {
  const flash = document.getElementById('flash-screen');
  flash.className = type;
  setTimeout(() => flash.className = '', 700);
}

const goldParticles = Array.from({ length: 50 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 2 + 0.5,
  vx: (Math.random() - 0.5) * 0.3,
  vy: -Math.random() * 0.5 - 0.1,
  alpha: Math.random() * 6
}));

function drawBackground() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  goldParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.alpha += 0.03;
    if (p.y < 0) {
      p.y = bgCanvas.height;
      p.x = Math.random() * bgCanvas.width;
    }
    bgCtx.fillStyle = `rgba(244, 196, 48, ${0.15 + 0.35 * Math.abs(Math.sin(p.alpha))})`;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fill();
  });
  requestAnimationFrame(drawBackground);
}
drawBackground();
</script>
