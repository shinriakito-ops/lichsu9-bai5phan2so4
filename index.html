<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bài 5 – Phần 4: Sự ra đời của các tổ chức yêu nước cách mạng</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Trống đồng & Canvas đồ họa nền -->
  <svg class="drum-bg" id="drumSvg" viewBox="-100 -100 200 200"></svg>
  <canvas id="bgCanvas"></canvas>
  <canvas id="confettiCanvas"></canvas>
  
  <div id="spotlight"></div>
  <div id="flashScreen"></div>
  <div id="progressBar"></div>

  <!-- Header -->
  <header class="top-bar">
    <div class="tag-pill">★ LỊCH SỬ 9 • KẾT NỐI TRI THỨC</div>
    <div class="tag-pill"><span id="currentSlideNum">01</span> / 20</div>
  </header>

  <!-- Khung Slide -->
  <main id="stage">
    <div id="slideContainer"></div>
  </main>

  <!-- Lightbox xem ảnh tư liệu -->
  <div id="lightbox" onclick="this.classList.remove('active')">
    <figure>
      <img id="lightboxImg" alt="Ảnh tư liệu">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <!-- Thanh timeline mốc thời gian -->
  <div class="timeline-bar" id="timelineBar"></div>

  <!-- Toast thông báo -->
  <div id="toastBox"></div>

  <script src="app.js"></script>
</body>
</html>
