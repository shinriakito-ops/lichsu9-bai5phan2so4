<style>

.tm{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(940px,86vw);height:6px;transform:translateX(-50%);background:rgba(212,175,55,.22);border-radius:3px;z-index:50}
.tm .f{height:100%;border-radius:3px;background:linear-gradient(90deg,#8b0000,var(--g2));box-shadow:0 0 12px var(--g2);transition:width 1.1s cubic-bezier(.16,1,.3,1)}

<script>
const $=i=>document.getElementById(i),st=$('st'),sc=$('sc'),K=['Khuynh hướng','Phương pháp','Kết quả'];
const Q=[
{q:'Ba tổ chức yêu nước cách mạng ra đời trong giai đoạn 1925 – 1928 là:',o:['Hội Việt Nam Cách mạng Thanh niên, Tâm tâm xã, Nam Đồng thư xã','Hội Phục Việt, Tâm tâm xã, Việt Nam Quốc dân đảng','Hội Việt Nam Cách mạng Thanh niên, Tân Việt Cách mạng đảng, Việt Nam Quốc dân đảng','Tân Việt Cách mạng đảng, Nam Đồng thư xã, Hội Phục Việt'],a:2,e:'Đó là Hội Việt Nam Cách mạng Thanh niên (6/1925), Việt Nam Quốc dân đảng (12/1927) và Tân Việt Cách mạng đảng (7/1928). Tâm tâm xã, Nam Đồng thư xã, Hội Phục Việt là cơ sở, tiền thân của các tổ chức này.'},
{q:'Nhận định nào đúng về khuynh hướng và phương pháp hoạt động của các tổ chức?',o:['Hội VNCMTN theo dân chủ tư sản; Quốc dân đảng theo vô sản, “vô sản hoá”','Hội VNCMTN theo vô sản, huấn luyện cán bộ, “vô sản hoá”; Quốc dân đảng theo dân chủ tư sản, bạo động, ám sát','Cả ba tổ chức đều theo khuynh hướng dân chủ tư sản, chủ trương bạo động','Tân Việt theo vô sản ngay từ đầu; Quốc dân đảng theo dân chủ tư sản, ám sát'],a:1,e:'Hội Việt Nam Cách mạng Thanh niên theo khuynh hướng vô sản (huấn luyện cán bộ, “vô sản hoá”). Việt Nam Quốc dân đảng theo khuynh hướng dân chủ tư sản, chủ trương bạo động, ám sát cá nhân.'},
{q:'Vì sao nói khuynh hướng vô sản ngày càng thắng thế trong phong trào dân tộc dân chủ ở Việt Nam?',o:['Vì thực dân Pháp ngừng đàn áp nên các tổ chức hoạt động tự do, phát triển mạnh','Vì khởi nghĩa Yên Bái thành công, Việt Nam Quốc dân đảng ngày càng lớn mạnh','Vì Hội VNCMTN bị giải tán sau vụ ám sát Bazin, Tân Việt lên thay vai trò lãnh đạo','Vì Yên Bái thất bại, Quốc dân đảng tan rã; Hội VNCMTN phát triển, Tân Việt chuyển theo vô sản'],a:3,e:'Khởi nghĩa Yên Bái thất bại và Quốc dân đảng tan rã cho thấy khuynh hướng dân chủ tư sản hoàn toàn bất lực. Trong khi đó, Hội Việt Nam Cách mạng Thanh niên phát triển và Tân Việt chuyển biến, chứng tỏ khuynh hướng vô sản ngày càng thắng thế.'}];
const S=[
{k:'cover'},
{k:'cards',y:1925,t:'1. Bối cảnh lịch sử',l:'Giai đoạn 1925 – 1930: các tổ chức yêu nước cách mạng lần lượt ra đời.',c:[['🔥','Phong trào phát triển','Phong trào dân tộc dân chủ phát triển mạnh.'],['⛓️','Pháp tăng cường đàn áp','Thực dân Pháp tăng cường đàn áp phong trào.'],['🤝','Tổ chức ra đời','Người yêu nước đoàn kết, lập các tổ chức yêu nước cách mạng, thúc đẩy phong trào đấu tranh mạnh mẽ hơn.']]},

let ac,nb,mg,muted=0;
function mute(){muted^=1;toast(muted?'🔇 Đã tắt âm thanh':'🔊 Đã bật âm thanh');if(muted)music(0);else if(cur==19)music(1)}
function AC(){if(!ac){ac=new AudioContext();nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
mg=ac.createGain();mg.gain.value=.8;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5500;const cp=ac.createDynamicsCompressor();mg.connect(lp);lp.connect(cp);cp.connect(ac.destination)}
if(ac.state=='suspended')ac.resume();return ac}
function tone(f,t,d,v,f2){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function air(t,d,v,f1,f2){const s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;b.type='bandpass';b.Q.value=.6;b.frequency.setValueAtTime(f1,t);b.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.45);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(b);b.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.05)}
let sth=0,vi=0,mus,mg2;
function stheme(){sth^=1;toast(sth?'Âm thanh: điện ảnh':'Âm thanh: công nghệ');sfx('go')}
function glide(t,f1,f2,d,v){const g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.4);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(lp);lp.connect(mg);[0,7].forEach(c=>{const o=ac.createOscillator();o.type='sine';o.detune.value=c;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(g);o.start(t);o.stop(t+d+.05)})}
function sfx(k){if(muted)return;try{AC();const t=ac.currentTime;
if(!sth){
if(k=='go'){const v=vi++%3;if(v==0){glide(t,330,880,.55,.07);air(t,.6,.05,2500,7000);tone(1760,t+.3,.18,.025)}else if(v==1){air(t,.7,.07,6000,1200);glide(t,880,440,.5,.06);tone(1320,t+.05,.15,.03)}else{air(t,.6,.08,500,3500);glide(t,220,660,.5,.07);tone(2093,t+.35,.12,.025)}}
if(k=='big'){glide(t,110,660,1.1,.1);glide(t,165,990,1.1,.05);air(t,1.2,.1,800,6000);tone(55,t+.4,1,.35,35)}
if(k=='ok'){[660,880,1320].forEach((f,i)=>{tone(f,t+i*.08,.5,.1);tone(f*2,t+i*.08,.3,.02)})}
if(k=='no'){glide(t,330,130,.4,.1);tone(70,t,.3,.3,45)}
if(k=='tick'){tone(110,t,.3,.4,48)}
}else{
if(k=='go'){air(t,.8,.16,350,1800);tone(80,t+.1,.45,.35,45)}
if(k=='big'){air(t,1.4,.26,160,2400);tone(58,t+.25,1.3,.6,32);tone(116,t+.25,.9,.12,60)}
if(k=='ok'){[523,659,784,1047].forEach((f,i)=>{tone(f,t+i*.07,.6,.16);tone(f*1.5,t+i*.07,.35,.04)});air(t,.35,.05,2000,5000)}
if(k=='no'){tone(220,t,.4,.3,110);tone(90,t,.35,.4,50);air(t,.25,.08,500,150)}
if(k=='tick'){tone(130,t,.3,.5,50)}}
}catch(e){}}
function clink(t,f){tone(f,t,.35,.05);tone(f*2.01,t,.18,.025);tone(f*3.02,t,.08,.012)}
function clinks(n){if(muted)return;try{AC();const t=ac.currentTime,P=[1175,1319,1568,1760,2093];for(let i=0;i<Math.min(n,6);i++)clink(t+.65+i*.15,P[i%5])}catch(e){}}
function pad(f,t,d,v){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+1.6);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg2);o.start(t);o.stop(t+d+.1)}
function pluck(f,t,v){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+2.4);g.connect(mg2);[['triangle',f,1],['sine',f*2,.3]].forEach(([ty,fr,m])=>{const o=ac.createOscillator(),h=ac.createGain();o.type=ty;o.frequency.value=fr;h.gain.value=m;o.connect(h);h.connect(g);o.start(t);o.stop(t+2.5)})}
function music(on){clearInterval(mus);if(mg2&&ac){mg2.gain.cancelScheduledValues(ac.currentTime);mg2.gain.setValueAtTime(Math.max(.0001,mg2.gain.value),ac.currentTime);mg2.gain.linearRampToValueAtTime(.0001,ac.currentTime+1.5)}
if(!on||muted)return;try{AC();const m=ac.createGain(),dl=ac.createDelay(),fb=ac.createGain();m.gain.setValueAtTime(.0001,ac.currentTime);m.gain.linearRampToValueAtTime(1,ac.currentTime+3);dl.delayTime.value=.45;fb.gain.value=.4;m.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mg);m.connect(mg);mg2=m;
const ch=[[146.83,220,293.66,369.99],[123.47,185,246.94,293.66],[98,146.83,196,246.94],[110,164.81,220,277.18]],pen=[587.33,659.25,739.99,880,987.77,1174.66];let b=0;
const step=()=>{const t=ac.currentTime+.05;ch[b%4].forEach(f=>pad(f,t,5.6,.03));for(let i=0;i<4;i++)if(Math.random()<.75)pluck(pen[Math.random()*pen.length|0]*(Math.random()<.2?.5:1),t+i*1.3+Math.random()*.2,.06);b++};
step();mus=setInterval(step,5200)}catch(e){}}
function conf(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:110},()=>({x:c.width/2,y:c.height*.6,vx:(Math.random()-.5)*18,vy:Math.random()*-16-2,s:Math.random()*8+4,l:100,c:['#f4c430','#34c759','#ff3b30','#fff'][Math.random()*4|0]}));
(function r(){x.clearRect(0,0,c.width,c.height);let a=0;P.forEach(p=>{if(p.l>0){a=1;p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l-=1.2;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)}});if(a)requestAnimationFrame(r)})()}
/* Nền: trống đồng xoay + bụi vàng */
let h='';for(let i=0;i<16;i++)h+=`<line y1="-24" y2="-46" transform="rotate(${i*22.5})"/>`;
$('dr').innerHTML=h+'<circle r="94" stroke-dasharray="2 5"/><circle r="84"/><circle r="72" stroke-dasharray="9 4"/><circle r="56"/><circle r="22"/><circle r="12" stroke-width="3"/>';
const bc=$('bg'),bx=bc.getContext('2d');function rs(){bc.width=innerWidth;bc.height=innerHeight}rs();addEventListener('resize',rs);
let SP=[];
function burst(){for(let i=0;i<54;i++){const a=Math.random()*6.283,v=2+Math.random()*7;SP.push({x:innerWidth/2,y:innerHeight/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,r:Math.random()*2+1})}}
function kickfx(){const d=$('dr');d.classList.remove('kick');void d.getBoundingClientRect();d.classList.add('kick');burst()}
function flash(c){const e=$('fl');e.className='';void e.offsetWidth;e.className=c}
addEventListener('pointermove',e=>{const r=document.documentElement.style;r.setProperty('--mx',e.clientX+'px');r.setProperty('--my',e.clientY+'px')});
const ps=Array.from({length:60},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.4,vx:(Math.random()-.5)*.3,vy:-Math.random()*.5-.1,a:Math.random()*6}));
(function L(){bx.clearRect(0,0,bc.width,bc.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.03;if(p.y<0){p.y=bc.height;p.x=Math.random()*bc.width}bx.fillStyle=`rgba(244,196,48,${.15+.35*Math.abs(Math.sin(p.a))})`;bx.beginPath();bx.arc(p.x,p.y,p.r,0,7);bx.fill()});SP.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vx*=.97;q.vy=q.vy*.97+.04;q.l-=.017;bx.fillStyle=`rgba(255,215,106,${Math.max(0,q.l)})`;bx.beginPath();bx.arc(q.x,q.y,q.r,0,7);bx.fill()});SP=SP.filter(q=>q.l>0);requestAnimationFrame(L)})();
</script>
